name: Deploy Aura Eyes Web (Production)

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auraeyes-web:latest
          build-args: |
            VITE_API_END_POINT=/api
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_N8N_WEBHOOK_URL=${{ secrets.VITE_N8N_WEBHOOK_URL }}
            VITE_API_END_AI_POINT=${{ secrets.VITE_API_END_AI_POINT }}
            VITE_AVATAR_FALLBACK_URL=https://api.dicebear.com/9.x/personas/svg?seed=

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    env:
      DEPLOY_DIR: /dulieu/phuoc/AuraEyes
    steps:
      - name: Pull and Restart Web Container
        run: |
          cd $DEPLOY_DIR
          docker compose pull web
          docker compose up -d web
          docker image prune -f
